name: Integration tests

# A manual run is named after the refs it tests, so the run list shows what each run tested
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Integration tests - core: {0} - LT: {1} - OPC UA: {2}', inputs.opendaq-ref, inputs.lt-modules-ref, inputs.opcua-modules-ref)
  || format('Integration tests - PR #{0} {1} - core, LT and OPC UA from the ref files', github.event.pull_request.number, github.event.pull_request.title) }}

on:
  pull_request:
  # The defaults are the refs in the ref files, which local builds use; keep them equal when a ref file changes
  workflow_dispatch:
    inputs:
      opendaq-ref:
        description: openDAQ branch, tag or full commit SHA (e.g. main, v3.40.3, pull/1363/head)
        type: string
        required: true
        default: Integration_test_removal
      lt-modules-ref:
        description: LTStreamingModulesModern branch, tag or full commit SHA
        type: string
        required: true
        default: main
      opcua-modules-ref:
        description: OpcUaModules branch, tag or full commit SHA
        type: string
        required: true
        default: main

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit; manual runs never cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      opendaq-sha: ${{ steps.resolve.outputs.opendaq-sha }}
      lt-modules-sha: ${{ steps.resolve.outputs.lt-modules-sha }}
      opcua-modules-sha: ${{ steps.resolve.outputs.opcua-modules-sha }}
    steps:
      - uses: actions/checkout@v7

      # Pull request runs have no inputs and take the refs from the ref files
      - name: Resolve the refs to commits
        id: resolve
        env:
          OPENDAQ_REF: ${{ inputs.opendaq-ref }}
          LT_MODULES_REF: ${{ inputs.lt-modules-ref }}
          OPCUA_MODULES_REF: ${{ inputs.opcua-modules-ref }}
          INTEGRATION_TESTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/resolve_refs.py

  # Builds the resolved commits and runs the integration tests with openDAQ-CI's reusable workflow, which core's CI also
  # uses: one job per catalog entry, in the environments of core's CI (Linux in ubuntu:26.04 containers)
  build-and-test:
    name: Build and test
    needs: resolve
    uses: openDAQ/openDAQ-CI/.github/workflows/reusable.yml@v4
    with:
      include-jobs: >
        [
          "windows-2022-x86_64-msvs-v143-release",
          "ubuntu-26.04-x86_64-ninja-gcc-15-release",
          "ubuntu-26.04-armv8-ninja-gcc-15-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      # The run command fetches the three sources at the resolved commits into build/_src before Configure.
      # The packages are the ones core's CI installs; the catalog entries add Mono and the compilers
      packages: >
        [
          {
            "run": "python3 .github/scripts/fetch_sources.py --opendaq ${{ needs.resolve.outputs.opendaq-sha }} --lt-modules ${{ needs.resolve.outputs.lt-modules-sha }} --opcua-modules ${{ needs.resolve.outputs.opcua-modules-sha }}"
          },
          {
            "match-jobs": ["ubuntu-*"],
            "apt-install": ["lld", "libssl-dev", "libx11-dev", "libxi-dev", "libxcursor-dev", "libxrandr-dev", "libgl-dev", "libudev-dev", "libfreetype-dev"]
          },
          {
            "match-jobs": ["windows-*"],
            "vcpkg-install": ["openssl"]
          }
        ]
      # FetchContent takes the fetched sources, and the *_REF variables keep their commits in the CMake cache.
      # As in core's CI: OpenSSL from vcpkg on Windows, tests run as root on macOS, the macOS deployment target.
      # GCC builds treat warnings as errors and, unlike MSVC and Clang builds, do not silence deprecations;
      # OpcUaModules still calls APIs that core deprecates
      cmake-presets: >
        [
          {
            "configure-preset": "ci",
            "test-preset": "ci-tests",
            "build-targets": ["test_ref_modules", "test_device_modules", "test_device_modules_streaming"],
            "cache-externals": true,
            "cache-variables": {
              "FETCHCONTENT_SOURCE_DIR_OPENDAQ": "${sourceDir}/build/_src/openDAQ",
              "FETCHCONTENT_SOURCE_DIR_LTSTREAMINGMODULESMODERN": "${sourceDir}/build/_src/LTStreamingModulesModern",
              "FETCHCONTENT_SOURCE_DIR_OPCUAMODULES": "${sourceDir}/build/_src/OpcUaModules",
              "OPENDAQ_REF": "${{ needs.resolve.outputs.opendaq-sha }}",
              "LT_MODULES_REF": "${{ needs.resolve.outputs.lt-modules-sha }}",
              "OPCUA_MODULES_REF": "${{ needs.resolve.outputs.opcua-modules-sha }}"
            }
          },
          {
            "match-jobs": ["windows-*-x86_64-*"],
            "cache-variables": {"OPENSSL_ROOT_DIR": "C:/vcpkg/installed/x64-windows"}
          },
          {
            "match-jobs": ["ubuntu-*-gcc-*"],
            "cache-variables": {"CMAKE_CXX_FLAGS": "-Wno-error=deprecated-declarations"}
          },
          {
            "match-jobs": ["macos-*"],
            "run-tests-priv": true
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          }
        ]

  # Reports the test results of each build-and-test job as annotations. One report job per platform, because GitHub
  # shows at most 10 error annotations per step; a job without results failed before any test ended
  report:
    name: Report ${{ matrix.name }}
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-and-test.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # A pattern rather than a name, so that a missing artifact is not an error
      - name: Download the test results
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.gtest-artifact }}
          path: test-results
          merge-multiple: true

      - name: Report the test results
        env:
          JOB: ${{ matrix.name }}
        run: >
          python3 .github/scripts/annotate_test_results.py --platform "$JOB"
          --gtest-xml-dir test-results --ctest-junit test-results/ctest/ctest-junit.xml
